<!doctype html><html lang="{{ language }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f8ff"><title>{% block title %}{{ t('KnutKnut Rutevalg') }}{% endblock %}</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='pitch.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='language.css') }}"></head><body>
<header><a class="brand" href="/"><span class="brand-mark"><i></i><i></i></span><span><strong>Knut Knut Transport</strong><small>You Knut, we deliver</small></span></a><div class="status"><span></span>{{ t('Basert på historiske kjøredata') }}</div><a class="language-toggle" href="{{ language_url }}" lang="{{ 'nb' if language == 'en' else 'en' }}" aria-label="{{ 'Bytt til norsk' if language == 'en' else 'Switch to English' }}">{{ 'Norsk' if language == 'en' else 'English' }}</a></header>
